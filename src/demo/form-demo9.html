<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品查询表单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .form-group {
                @apply flex items-center gap-2 w-[280px] whitespace-nowrap; /* 核心：禁止换行 + 加宽容器 */
            }
            .form-label {
                @apply text-sm font-medium text-gray-700 w-[100px] text-right whitespace-nowrap; /* 标签不换行 */
            }
            .form-control {
                @apply border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 w-full transition-all whitespace-nowrap; /* 输入框内容不换行 */
            }
            .btn-primary {
                @apply bg-blue-600 text-white rounded px-4 py-1.5 text-sm cursor-pointer hover:bg-blue-700 transition-colors flex items-center gap-1 whitespace-nowrap;
            }
            .btn-default {
                @apply border border-gray-300 rounded px-4 py-1.5 text-sm cursor-pointer hover:bg-gray-100 transition-colors flex items-center gap-1 whitespace-nowrap;
            }
        }
    </style>
</head>
