<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        sidebar: '#1E3A8A',
                        sidebarHover: '#3B82F6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <!-- 顶部导航 -->
    <header class="bg-primary text-white h-12 flex items-center justify-between px-4">
        <div class="font-bold text-lg">CRM管理系统</div>
        <div class="flex items-center gap-4">
            <span>欢迎，管理员</span>
            <button class="bg-secondary px-4 py-1 rounded text-sm">退出登录</button>
        </div>
    </header>

    <div class="flex h-[calc(100vh-3rem)]">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-sidebar text-white flex flex-col">
            <div class="p-4 text-lg font-bold">导航菜单</div>
            <div class="sidebar-item">
                <i class="fa fa-home"></i>
                <span>主页</span>
            </div>
            <div class="sidebar-item">
                <i class="fa fa-users"></i>
                <span>客户管理</span>
            </div>
            <div class="sidebar-item">
                <i class="fa fa-cubes"></i>
                <span>产品管理</span>
            </div>
            <div class="sidebar-item">
                <i class="fa fa-tasks"></i>
                <span>任务管理</span>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 p-6">
            <div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white p-6 rounded-lg shadow">
                <h1 class="text-2xl font-bold">欢迎来到CRM管理系统</h1>
                <p class="mt-2">高效管理客户信息，提升业务效率。</p>
            </div>

            <div class="mt-6 grid grid-cols-3 gap-6">
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-lg font-bold text-primary">客户总数</h2>
                    <p class="text-2xl font-bold mt-2">1,234</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-lg font-bold text-primary">今日新增</h2>
                    <p class="text-2xl font-bold mt-2">56</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-lg font-bold text-primary">待办任务</h2>
                    <p class="text-2xl font-bold mt-2">12</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
