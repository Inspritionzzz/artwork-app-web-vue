    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16A34A',
                        secondary: '#E2E8F0'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '2px',
                        DEFAULT: '4px',
                        'md': '8px',
                        'lg': '12px',
                        'xl': '16px',
                        '2xl': '20px',
                        '3xl': '24px',
                        'full': '9999px',
                        'button': '4px'
                    }
                }
            }
        }
    </script>
    <script>
        flatpickr("#datePicker", {
            dateFormat: "Y-m-d", // 日期格式
            defaultDate: new Date(), // 默认选中当前日期
            // 可根据需求添加更多配置（如范围选择、禁用日期等）
        });
    </script>
    <style>

        .font-pacifico {

            padding: 24px;

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        const option = {
            animation: false,
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: [
                {
                    type: 'category',
                    data: ['国泰海通', '招商证券', '中信证券', '广发证券', '中金公司', '华泰证券', '兴业证券', '中信建投', '中国银河', '申万宏源'],

                        alignWithLabel: true
                    },
                    axisLabel: {
                        fontSize: 14,
                        color: '#333'
                    }
                }
            ],
            yAxis: [
                {
                    type: 'value',
                    name: '单位：支数',
                    min: 0,
                    max: 300,
                    interval: 50,
                    axisLabel: {
                        fontSize: 12,
                        color: '#666'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#eee'
                        }
                    }
                }
            ],
            series: [
                {
                    name: '各券商托管产品分布',
                    type: 'bar',
                    barWidth: '60%',
                    data: [
                        { value: 248, itemStyle: { color: '#1E40AF' } },
                        { value: 235, itemStyle: { color: '#1E40AF' } },
                        { value: 200, itemStyle: { color: '#1E40AF' } },
                        { value: 150, itemStyle: { color: '#1E40AF' } },
                        { value: 100, itemStyle: { color: '#1E40AF' } },
                        { value: 80, itemStyle: { color: '#1E40AF' } },
                        { value: 50, itemStyle: { color: '#1E40AF' } },
                        { value: 30, itemStyle: { color: '#1E40AF' } },
                        { value: 20, itemStyle: { color: '#1E40AF' } },
                        { value: 10, itemStyle: { color: '#1E40AF' } }
                    ],
                    label: {
                        show: true,
                        position: 'top',
                        fontSize: 14,
                        fontWeight: 'bold',
                        color: '#333'
                    }
                }
            ]
        };
        myChart.setOption(option);
    </script>
