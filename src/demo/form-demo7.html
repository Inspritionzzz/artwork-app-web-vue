<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tailwind Modal</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<!-- 触发按钮 -->
<button
        onclick="document.getElementById('modal').classList.remove('hidden')"
        class="px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition"
>
    打开弹窗
</button>

<!-- 弹窗容器 -->
<div id="modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
    <!-- 遮罩层 -->
    <div
            class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"
            onclick="document.getElementById('modal').classList.add('hidden')"
    ></div>

    <!-- 弹窗内容 -->
    <div class="flex min-h-full items-center justify-center p-4">
        <div
                class="relative w-full max-w-md transform rounded-xl bg-white p-6 shadow-xl transition-all"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-title"
        >
            <!-- 关闭按钮 -->
            <button
                    onclick="document.getElementById('modal').classList.add('hidden')"
                    class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
            >
                ✕
            </button>

            <!-- 标题 -->
            <h2 id="modal-title" class="text-xl font-bold text-gray-900 mb-4">提示信息</h2>

            <!-- 内容 -->
            <p class="text-gray-600 mb-6">
                已经为 嘉实中证500交易型开放式指数证券投资基金联接基金 注册P码（P00000000007），请勿重复注册！
            </p>

            <!-- 操作按钮 -->
            <div class="flex justify-end space-x-3">
                <button
                        onclick="document.getElementById('modal').classList.add('hidden')"
                        class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50"
                >
                    取消
                </button>
                <button
                        class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
                >
                    确认
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
