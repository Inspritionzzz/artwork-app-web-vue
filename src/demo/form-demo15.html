<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>加入例外表（产品）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6', // Tailwind 默认 blue-500
                        primaryHover: '#2563eb', // blue-600
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        /* 模态框背景遮罩 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        /* 弹窗圆角 & 阴影 */
        .modal-content {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
            0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 90%;
            max-width: 600px;
            overflow: hidden;
        }
        /* 输入框边框聚焦效果 */
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- 模态框容器（模拟点击触发） -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <!-- 标题栏 -->
        <div class="bg-blue-500 text-white px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold">加入例外表（产品）</h2>
            <button
                    type="button"
                    class="text-white hover:text-gray-200 transition-colors"
                    onclick="document.getElementById('modal').classList.add('hidden')"
                    aria-label="关闭"
            >
                ×
            </button>
        </div>

        <!-- 内容区 -->
        <div class="p-6">
            <!-- 说明文字 -->
            <p class="text-gray-600 text-sm mb-6 leading-relaxed">
                您正在对 <span class="font-medium">统一账户系统 (UCA)</span> 的产品
                <span class="font-medium">宁德时代新能源科技股份有限公司 - 2026年A股员工持股计划（111901351486）</span>
                进行操作
            </p>


            <p class="text-sm font-medium text-gray-700 mb-3">产品管理人：</p>
                <div class="flex items-center mb-4">
                    <input type="text" placeholder="请输入关键字进行查询" class="flex-1 border border-gray-300 rounded-l-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <button class="bg-gray-200 border border-gray-300 rounded-r-md px-3 py-2 hover:bg-gray-300 transition-colors">
                        <i class="fas fa-search text-gray-600">选择</i>
                    </button>
                </div>
            <p class="text-sm font-medium text-gray-700 mb-3">产品管理人G码：</p>
            <div class="flex items-center mb-4">
                <input type="text" placeholder="" class="flex-1 border border-gray-300 rounded-l-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- 备注输入框 -->
            <div class="mb-6">
                <label for="remark" class="block text-sm font-medium text-gray-700 mb-2">
                    <span class="text-red-500">*</span> 备注
                </label>
                <div class="relative">
          <textarea
                  id="remark"
                  rows="4"
                  maxlength="50"
                  placeholder="请输入备注（最多 50 字）"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none"
          ></textarea>
                    <div class="absolute bottom-2 right-3 text-xs text-gray-500">
                        <span id="charCount">0</span> / 50
                    </div>
                </div>
                <p class="mt-2 text-xs text-gray-500 italic">请勿输入敏感信息</p>
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                <button
                        type="button"
                        class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors"
                        onclick="document.getElementById('modal').classList.add('hidden')"
                >
                    取消并关闭
                </button>
                <button
                        type="button"
                        class="px-5 py-2.5 text-sm font-medium text-white bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded-lg transition-colors"
                >
                    确定
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // 实时字符计数
    const textarea = document.getElementById('remark');
    const charCount = document.getElementById('charCount');

    textarea.addEventListener('input', function () {
        const len = this.value.length;
        charCount.textContent = len;
        // 可选：超长时变红提示
        charCount.className = len > 50 ? 'text-red-500' : 'text-gray-500';
    });
</script>

</body>
</html>
